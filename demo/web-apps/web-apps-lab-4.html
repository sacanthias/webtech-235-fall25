<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-4-HW</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["red","green","blue","purple","pink"];
let foods = ["apple", "mango", "pear"]; // add some foods

// Optional - can you figure out how to pull both the key AND the value
// from the `links` object literal?
let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu"
	}

function createList(listElement, array = ["puppydogs", "butterflies", "lollipops"]){
	for(let i of array){
		let a = document.querySelector(listElement).appendChild(document.createElement("li"));
		a.innerHTML = array[i];
	}
}

// iterating through the above lists
createList("#colorsList", colors);
createList("#foodList", foods);

let linksList = document.querySelector("#linksList");
for(let l in links){
	let link = linksList.appendChild(document.createElement("li"));
	let a = link.appendChild(document.createElement("a"));
	// pulls the value
	a.href = links[l];
	// pulls the key
	a.innerHTML = l;
}

</script>
</body>
</html>
