<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 - Prototype</title>

    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <h1>Animanga Index</h1>
    </header>
    
    <div id="content">
        <div id="widgetHolder">
            <div class="widget"><input id="searchterm" type="text" size="20" maxlength="20" autofocus value="haikyuu" /></div>

            <div class="widget">
                Show Results by
                <select id="limit">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                </select>
            </div>

            <div class="widget">
                <p><input type="radio" name="mediaGroup" id="mediaAnime" value="true" /> Anime only</p>
                <p><input type="radio" name="mediaGroup" id="mediaManga" value="true" /> Manga only</p>
                <p><input type="checkbox" name="mediaGroup" id="mediaSFW" value="SFW" /> Filter out NSFW</p>
            </div>

            <button type="button" id="search" class="green">test!</button>
            <p id="resultText"></p>
        </div>

        <div id="seasonal"></div>
        <div id="season_past"></div>
        <div id="top_anime"></div>
        <div id="top_manga"></div>
        <div id="searchResults"></div>
    </div>
</body>
</html>
